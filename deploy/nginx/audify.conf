# nginx reverse proxy for audify.
# Place in /etc/nginx/sites-available/audify.conf and symlink into sites-enabled,
# then run certbot to add TLS (see deploy notes). Proxies to the api container
# published on 127.0.0.1:8091.

server {
    listen 80;
    listen [::]:80;
    server_name audify.antonslab.eu;

    # Allow large PDF uploads via POST /api/articles if used later.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream audio efficiently and pass through byte-range requests.
        proxy_buffering off;
    }
}
